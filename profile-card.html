<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Server Practice Linux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #c3bfb3;
    --card-bg: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #6b6b68;
    --rule: #e3e1db;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    font-family: 'Noto Sans KR', 'Inter', -apple-system, sans-serif;
    padding: 40px 20px;
  }

  .card {
    width: 900px;
    max-width: 100%;
    background: var(--card-bg);
    display: grid;
    grid-template-columns: 1.03fr 1fr;
    box-shadow: 0 30px 60px rgba(0,0,0,0.18);
  }

  .info {
    padding: 46px 44px 40px;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .info-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .name {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--ink);
    margin: 0 0 14px;
  }

  .dob {
    font-size: 13px;
    color: var(--ink-soft);
    margin: 0 0 10px;
    letter-spacing: 0.2px;
  }

  .phone {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--ink);
  }

  .phone svg { flex: none; }

  .qr {
    width: 66px;
    height: 66px;
    object-fit: contain;
    margin-top: 2px;
  }

  .divider {
    height: 1px;
    background: var(--rule);
    margin: 30px 0 24px;
  }

  .facts {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: auto;
  }

  .fact {
    display: grid;
    grid-template-columns: 52px 1fr;
    column-gap: 18px;
    font-size: 13.5px;
    line-height: 1.5;
  }

  .fact .label {
    color: var(--ink);
    font-weight: 500;
  }

  .fact .value {
    color: var(--ink);
  }

  .fact .value .year {
    color: var(--ink-soft);
  }

  .credits {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 34px;
  }

  .photo {
    position: relative;
    background: #f4f4f2;
    overflow: hidden;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .photo-names {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 26px;
    display: flex;
    justify-content: space-between;
    padding: 0 28px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.5px;
    color: #1a1a1a;
  }

  @media (max-width: 720px) {
    .card { grid-template-columns: 1fr; }
    .photo { min-height: 360px; }
  }
</style>
</head>
<body>

  <div class="card">
    <div class="info">
      <div class="info-top">
        <div>
          <p class="name">Server Practice Linux</p>
          <p class="dob">192.168.212.90</p>
        </div>
        <img class="qr" src="meme.jpe" alt="QR Code">
      </div>
      <div class="divider"></div>

      <div class="facts">
        <div class="fact">
          <span class="label">Name</span>
          <span class="value">Gendhis After Riyadini</span>
        </div>
      </div>

      <div class="credits">
        <div class="fact">
          <span class="label">Major</span>
          <span class="value">Computer Network Engineering<span class="year"> (XII TKJ)</span></span>
        </div>
        <div class="fact">
          <span class="label">Status</span>
          <span class="value"><span class="year">&lt;Server Active&gt;</span></span>
        </div>
        <div class="fact">
          <span class="label">Credits</span>
          <span class="value"><span class="year">Go Younjung</span></span>
        </div>
      </div>
    </div>

    <div class="photo">
      <img src="younjung.jpe" alt="진정연 사진">
      <div class="photo-names">
        <span>GO YOUNJUNG</span>
        <span>JIN</span>
      </div>
    </div>
  </div>

</body>
</html>
